name: Dates

options:
  bundleIdPrefix: com.cdtm88
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  DatesKit:
    path: DatesKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Signing lives here rather than in Xcode's UI: the pbxproj is generated, so a team
    # set through Signing & Capabilities would be wiped by the next `xcodegen generate`.
    # CI is unaffected — it builds with CODE_SIGNING_ALLOWED=NO.
    DEVELOPMENT_TEAM: 222HG57693

targets:
  Dates:
    type: application
    platform: iOS
    sources:
      - path: Dates
    dependencies:
      - package: DatesKit
        product: DatesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdtm88.Dates
        PRODUCT_NAME: Dates
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only for v1 (D-01, PRD §9).
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Dates/Resources/Info.plist
      properties:
        CFBundleDisplayName: Dates
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Calendar import is read-only, but EventKit has no read-only tier: reading
        # requires full access (IMP, Phase 05).
        NSCalendarsFullAccessUsageDescription: >-
          Dates reads your calendars to find birthdays and other yearly events you may
          want reminders for. Nothing is written back to your calendar.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Background refresh tops up the notification queue (NOTIF-06, D-09).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.cdtm88.Dates.queueTopUp

  DatesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DatesTests
    dependencies:
      - target: Dates
      - package: DatesKit
        product: DatesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdtm88.DatesTests
        GENERATE_INFOPLIST_FILE: YES

  DatesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DatesUITests
    dependencies:
      - target: Dates
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdtm88.DatesUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dates

schemes:
  Dates:
    build:
      targets:
        Dates: all
    test:
      targets:
        - DatesTests
        - DatesUITests
      gatherCoverageData: true
    run:
      config: Debug
